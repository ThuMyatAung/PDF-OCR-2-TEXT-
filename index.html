<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Book Reader & Translator</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --accent: #38bdf8;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }
    input[type="text"], input[type="file"] {
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    button:disabled { background: #475569; cursor: not-allowed; }
    .main-workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      height: calc(100vh - 58px);
      overflow: hidden;
    }
    .panel {
      padding: 20px;
      overflow-y: auto;
      height: 100%;
      box-sizing: border-box;
    }
    .panel-left {
      border-right: 1px solid var(--border);
      background: #182234;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .panel-right {
      background: var(--bg);
      line-height: 1.7;
    }
    canvas {
      max-width: 100%;
      height: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      border-radius: 4px;
      background: #ffffff;
    }
    .nav-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    #logBox {
      width: 90%;
      background: #0b1120;
      border: 1px solid #334155;
      color: #38bdf8;
      font-family: monospace;
      font-size: 12px;
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    th { background: #1e293b; color: var(--accent); }
    blockquote {
      border-left: 4px solid var(--accent);
      margin: 12px 0;
      padding: 6px 12px;
      background: #1e293b;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

<header>
  <b>📖 AI PDF Reader</b>
  
  <input type="file" id="pdfInput" accept="application/pdf" />
  <input type="text" id="apiKeyInput" placeholder="Paste Gemini API Key" style="width: 200px;" />
  <select id="modelSelect" title="Gemini Model" style="background:#0f172a;border:1px solid #334155;color:#fff;padding:6px;border-radius:6px;font-size:13px;">
    <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
    <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (Quota များ)</option>
    <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
  </select>

  <div class="nav-controls">
    <button id="prevBtn" onclick="changePage(-1)" disabled>◀ ရှေ့</button>
    <span id="pageTracker">Page: 0 / 0</span>
    <button id="nextBtn" onclick="changePage(1)" disabled>နောက် ▶</button>
    <button id="translateBtn" onclick="translateCurrentPage()" style="background:#0284c7;" disabled>⚡ ဘာသာပြန်မည်</button>
  </div>
</header>

<div class="main-workspace">
  <div class="panel panel-left" id="canvasContainer">
    <canvas id="pdfCanvas" style="display:none;"></canvas>
    <div id="logBox">📄 PDF ဖိုင် ရွေးချယ်ပေးပါရန် စောင့်ဆိုင်းနေပါသည်...</div>
  </div>

  <div class="panel panel-right" id="translationOutput">
    <div style="color: #64748b; text-align: center; margin-top: 60px;">
      စာအုပ်မျက်နှာပြင် ပေါ်လာပါက '⚡ ဘာသာပြန်မည်' ကို နှိပ်၍ ဖတ်ရှုနိုင်ပါသည်...
    </div>
  </div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  let currentPdf = null;
  let currentPageNum = 1;
  let totalPages = 0;
  let pageTranslations = {};
  let pageTexts = {};

  const modelSelect = document.getElementById('modelSelect');
  if (localStorage.getItem('gemini_model')) modelSelect.value = localStorage.getItem('gemini_model');
  modelSelect.addEventListener('change', () => localStorage.setItem('gemini_model', modelSelect.value));

  const canvas = document.getElementById('pdfCanvas');
  const ctx = canvas.getContext('2d');
  const output = document.getElementById('translationOutput');
  const pageTracker = document.getElementById('pageTracker');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const translateBtn = document.getElementById('translateBtn');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const logBox = document.getElementById('logBox');

  function addLog(msg) {
    logBox.style.display = 'block';
    logBox.innerText += `\n> ${msg}`;
  }

  if (localStorage.getItem('gemini_api_key')) {
    apiKeyInput.value = localStorage.getItem('gemini_api_key');
  }
  apiKeyInput.addEventListener('change', () => {
    localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
  });

  document.getElementById('pdfInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    canvas.style.display = 'none';
    logBox.innerText = `[အဆင့် ၁] ဖိုင်အရွယ်အစား: ${(file.size / (1024 * 1024)).toFixed(1)} MB ကို စတင်ဖတ်ရှုနေပါသည်...`;

    const reader = new FileReader();

    reader.onload = async function() {
      addLog("[အဆင့် ၂] ဖိုင်ဒေတာများကို Memory ထဲ အောင်မြင်စွာ တင်သွင်းပြီးပါပြီ။");
      addLog("[အဆင့် ၃] PDF Document ကို ဖွင့်နေပါသည်...");

      try {
        const typedarray = new Uint8Array(this.result);
        const loadingTask = pdfjsLib.getDocument({
          data: typedarray,
          cMapPacked: true
        });

        currentPdf = await loadingTask.promise;
        totalPages = currentPdf.numPages;
        currentPageNum = 1;

        addLog(`[အဆင့် ၄] အောင်မြင်ပါပြီ! စုစုပေါင်း စာမျက်နှာ: ${totalPages} မျက်နှာ ရှိပါသည်။`);
        renderPage(currentPageNum);

      } catch (err) {
        console.error(err);
        addLog(`❌ အမှားဖြစ်ပေါ်ပါသည်: ${err.message}`);
      }
    };

    reader.onerror = function() {
      addLog("❌ ကွန်ပျူတာမှ ဖိုင်ကို ဖတ်မရပါ (FileReader Error)");
    };

    reader.readAsArrayBuffer(file);
  });

  async function renderPage(num) {
    if (!currentPdf) return;

    try {
      const page = await currentPdf.getPage(num);
      const viewport = page.getViewport({ scale: 1.5 });

      canvas.height = viewport.height;
      canvas.width = viewport.width;

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;

      canvas.style.display = 'block';
      logBox.style.display = 'none';

      pageTracker.innerText = `Page: ${num} / ${totalPages}`;
      prevBtn.disabled = num <= 1;
      nextBtn.disabled = num >= totalPages;
      translateBtn.disabled = false;

      if (pageTranslations[num]) {
        output.innerHTML = marked.parse(pageTranslations[num]);
      } else {
        showExtractedText(num, page);
      }
    } catch (err) {
      console.error(err);
      addLog(`❌ စာမျက်နှာဆွဲရာတွင် အမှားဖြစ်ပါသည်: ${err.message}`);
    }
  }

  function escapeHtml(t) {
    return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  async function showExtractedText(num, page) {
    try {
      if (pageTexts[num] === undefined) {
        const tc = await page.getTextContent();
        let txt = '', lastY = null;
        for (const it of tc.items) {
          const y = Math.round(it.transform[5]);
          if (lastY !== null && Math.abs(y - lastY) > 2) txt += '\n';
          txt += it.str + ' ';
          lastY = y;
        }
        pageTexts[num] = txt.trim();
      }
      const txt = pageTexts[num];
      if (currentPageNum !== num) return;
      if (txt.length >= 20) {
        output.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <b style="color:#38bdf8;">📄 စာမျက်နှာ (${num}) မှ ထုတ်ယူထားသော စာသား</b>
            <button onclick="copyPageText(${num})" style="padding:4px 10px;font-size:12px;">📋 Copy</button>
          </div>
          <pre style="white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:13px;line-height:1.8;background:#182234;border:1px solid #334155;border-radius:6px;padding:12px;">${escapeHtml(txt)}</pre>
          <p style="color:#64748b;font-style:italic;">မြန်မာလို ဘာသာပြန်လိုပါက အပေါ်ရှိ '⚡ ဘာသာပြန်မည်' ကို နှိပ်ပါ။</p>`;
      } else {
        output.innerHTML = `<p style='color: #64748b; font-style: italic;'>စာမျက်နှာ (${num}) တွင် ထုတ်ယူနိုင်သော စာသား မရှိပါ — scan/photo စာမျက်နှာ ဖြစ်နိုင်ပါသည်။ '⚡ ဘာသာပြန်မည်' (Gemini OCR) ကို နှိပ်၍ ဖတ်နိုင်ပါသည်။</p>`;
      }
    } catch (e) {
      console.warn('text extraction failed', e);
    }
  }

  function copyPageText(num) {
    const t = pageTexts[num] || '';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t);
    }
  }

  function changePage(delta) {
    if (currentPageNum + delta >= 1 && currentPageNum + delta <= totalPages) {
      currentPageNum += delta;
      renderPage(currentPageNum);
    }
  }

  // Gemini 3.6 Flash သို့ ချိတ်ဆက်၍ ဘာသာပြန်ခြင်း
  async function translateCurrentPage() {
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) {
      alert("အပေါ်ဘားရှိ အကွက်ထဲတွင် Gemini API Key ထည့်ပေးပါခင်ဗျာ။");
      return;
    }

    translateBtn.disabled = true;
    output.innerHTML = `<p style='color: #38bdf8;'>စာမျက်နှာ (${currentPageNum}) ရှိ စာသား၊ ဇယားများနှင့် ပုံကြမ်းများကို Gemini AI ဖြင့် ဘာသာပြန်ဆိုနေပါသည်... ခေတ္တစောင့်ပါ...</p>`;

    try {
      const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

      const promptText = `
You are an expert book translator. Translate this book page into natural, elegant Burmese (မြန်မာစာ).
1. Translate text into smooth literary Burmese.
2. If there are TABLES: Render them cleanly as Markdown tables with Burmese headers.
3. If there are DIAGRAMS or ILLUSTRATIONS: Translate labels and add a blockquote note: > **[ပုံကြမ်း/ဇယား ရှင်းလင်းချက်: ...]** explaining it.
4. Output clean Markdown only.`;

      const model = modelSelect.value;
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: promptText },
              { inline_data: { mime_type: "image/jpeg", data: base64Image } }
            ]
          }]
        })
      });

      const data = await response.json();
      if (data.error) {
        if (response.status === 429 || /quota|RESOURCE_EXHAUSTED/i.test(data.error.message || '')) {
          throw new Error('Quota ပြည့်သွားပါပြီ (Free tier ကန့်သတ်ချက်)။ ခဏစောင့်ပါ (သို့) Model ကို Gemini 3.5 Flash-Lite သို့ ပြောင်း၍ စမ်းကြည့်ပါ — ၎င်းမှာ တစ်နေ့တာ Quota ပိုများပါသည်။ မူရင်း: ' + data.error.message);
        }
        throw new Error(data.error.message);
      }
      if (!data.candidates || !data.candidates.length) {
        const fb = data.promptFeedback && data.promptFeedback.blockReason ? ' (blockReason: ' + data.promptFeedback.blockReason + ')' : '';
        throw new Error('Gemini မှ အဖြေ ပြန်မလာပါ' + fb + '။ ခဏနေ၍ ပြန်စမ်းကြည့်ပါ။');
      }

      const translatedMarkdown = data.candidates[0].content.parts.map(p => p.text || '').join('');
      pageTranslations[currentPageNum] = translatedMarkdown;
      output.innerHTML = marked.parse(translatedMarkdown);

    } catch (err) {
      console.error(err);
      output.innerHTML = `<p style='color: #ef4444;'><b>ဘာသာပြန်မအောင်မြင်ပါ:</b><br/>${err.message}</p>`;
    } finally {
      translateBtn.disabled = false;
    }
  }
</script>

</body>
</html>
